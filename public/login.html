<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>M1NewsTV AI | Login</title>
    <link rel="icon" type="image/png" href="https://m1newstv.com/wp-content/uploads/2018/02/favicon-32x32.png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-50">
    <main class="flex min-h-screen items-center justify-center px-6 py-12">
        <div class="w-full max-w-md">
            <!-- ======================================== -->
            <!-- CABEÇALHO -->
            <!-- ======================================== -->
            <div class="mb-8 text-center">
                <h1 class="text-3xl font-bold tracking-tight text-slate-950">
                    M1NewsTV AI
                </h1>
                <p class="mt-2 text-sm text-slate-500">
                    Assistente de redação
                </p>
            </div>
            <!-- ======================================== -->
            <!-- CARD -->
            <!-- ======================================== -->
            <div class="rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
                <div class="mb-6">
                    <p class="mt-1 text-center text-sm text-slate-500">
                        Informe seu usuário e senha para continuar.
                    </p>
                </div>
                <!-- ======================================== -->
                <!-- FORMULÁRIO -->
                <!-- ======================================== -->
                <form id="loginForm" class="space-y-5">
                    <!-- USUÁRIO -->
                    <div>
                        <label
                            for="username"
                            class="mb-2 block text-sm font-semibold text-slate-700"
                        >
                            Usuário
                        </label>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            autocomplete="username"
                            placeholder="Digite seu usuário"
                            class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-slate-500 focus:ring-2 focus:ring-slate-200"
                            required
                        >
                    </div>
                    <!-- SENHA -->
                    <div>
                        <label
                            for="password"
                            class="mb-2 block text-sm font-semibold text-slate-700"
                        >
                            Senha
                        </label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            autocomplete="current-password"
                            placeholder="Digite sua senha"
                            class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-slate-500 focus:ring-2 focus:ring-slate-200"
                            required
                        >
                    </div>
                    <!-- ERRO -->
                    <div
                        id="erro"
                        class="hidden rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-600"
                    ></div>
                    <!-- BOTÃO -->
                    <button
                        type="submit"
                        id="loginButton"
                        class="w-full rounded-xl bg-slate-950 px-6 py-3 font-semibold text-white transition hover:bg-slate-800 disabled:cursor-not-allowed disabled:opacity-60"
                    >
                        Entrar
                    </button>
                </form>
                    <div class="mt-6 text-center">
                        <p class="text-sm text-slate-500">
                            Ainda não possui uma conta?
                        </p>
                    
                        <a href="/register.html" class="mt-2 inline-block text-sm font-semibold text-slate-900 hover:text-slate-600">
                            Criar nova conta →
                        </a>
                    </div>
            </div>
            <!-- ======================================== -->
            <!-- RODAPÉ -->
            <!-- ======================================== -->
            <p class="mt-6 text-center text-xs text-slate-400">
                Desenvolvido por Jeanderson Amaral
            </p>
        </div>
    </main>
    <script src="/js/login.js"></script>
</body>
</html>
