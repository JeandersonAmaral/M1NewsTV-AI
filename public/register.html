<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M1News AI | Assistente de redação</title>
    <link rel="icon" type="image/png" href="https://m1newstv.com/wp-content/uploads/2018/02/favicon-32x32.png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-50">
    <main class="flex min-h-screen items-center justify-center px-6 py-12">
        <div class="w-full max-w-md">
            <!-- ======================================== -->
            <!-- CABEÇALHO -->
            <!-- ======================================== -->
            <div class="mb-8 text-center">
                <img src="/images/M1_logo.png" alt="M1NewsTV" class="mx-auto h-20 w-28 object-contain">
                <h1 class="text-3xl font-bold tracking-tight text-slate-950">
                    M1News AI
                </h1>
                <p class="mt-2 text-sm text-slate-500">
                    Assistente de redação
                </p>
            </div>
            <!-- ======================================== -->
            <!-- CARD -->
            <!-- ======================================== -->

            <div class="rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">

                <!-- ======================================== -->
                <!-- TÍTULO -->
                <!-- ======================================== -->

                <div class="mb-6 text-center">

                    <h2 class="text-xl font-bold text-slate-950">
                        Criar nova conta
                    </h2>

                    <p class="mt-2 text-sm text-slate-500">
                        Preencha os dados abaixo para criar sua conta.
                    </p>

                </div>

                <!-- ======================================== -->
                <!-- FORMULÁRIO -->
                <!-- ======================================== -->

                <form id="registerForm" class="space-y-5">

                    <!-- USUÁRIO -->

                    <div>

                        <label for="username" class="mb-2 block text-sm font-semibold text-slate-700">
                            Usuário
                        </label>

                        <input type="text" id="username" name="username" autocomplete="username"
                            placeholder="Digite seu usuário" minlength="3"
                            class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-slate-500 focus:ring-2 focus:ring-slate-200"
                            required>

                    </div>

                    <!-- SENHA -->

                    <div>
                        <label for="senha" class="mb-2 block text-sm font-semibold text-slate-700">
                            Senha
                        </label>

                        <div class="relative">
                            <input type="password" id="senha" name="senha" autocomplete="new-password"
                                placeholder="Digite sua senha" minlength="6"
                                class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 pr-12 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-slate-500 focus:ring-2 focus:ring-slate-200"
                                required>

                            <button type="button" id="toggleSenha"
                                class="absolute right-3 top-1/2 -translate-y-1/2 rounded-lg p-2 text-slate-400 transition hover:text-slate-700"
                                aria-label="Mostrar senha">
                                <svg id="eyeSenha" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                    stroke-width="1.8" stroke="currentColor" class="h-5 w-5">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M2.036 12.322a1.012 1.012 0 010-.644C3.423 7.51 7.36 5 12 5c4.64 0 8.577 2.51 9.964 6.678.054.16.054.332 0 .644C20.577 16.49 16.64 19 12 19c-4.64 0-8.577-2.51-9.964-6.678z" />
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                </svg>
                            </button>
                        </div>

                        <p class="mt-2 text-xs text-slate-400">
                            Mínimo de 6 caracteres.
                        </p>
                    </div>

                    <!-- CONFIRMAR SENHA -->

                    <div>
                        <label for="confirmarSenha" class="mb-2 block text-sm font-semibold text-slate-700">
                            Confirmar senha
                        </label>

                        <div class="relative">
                            <input type="password" id="confirmarSenha" name="confirmarSenha" autocomplete="new-password"
                                placeholder="Digite sua senha novamente" minlength="6"
                                class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 pr-12 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-slate-500 focus:ring-2 focus:ring-slate-200"
                                required>

                            <button type="button" id="toggleConfirmarSenha"
                                class="absolute right-3 top-1/2 -translate-y-1/2 rounded-lg p-2 text-slate-400 transition hover:text-slate-700"
                                aria-label="Mostrar senha">
                                <svg id="eyeConfirmarSenha" xmlns="http://www.w3.org/2000/svg" fill="none"
                                    viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="h-5 w-5">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M2.036 12.322a1.012 1.012 0 010-.644C3.423 7.51 7.36 5 12 5c4.64 0 8.577 2.51 9.964 6.678.054.16.054.332 0 .644C20.577 16.49 16.64 19 12 19c-4.64 0-8.577-2.51-9.964-6.678z" />
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- ERRO / MENSAGEM -->

                    <div id="erro"
                        class="hidden rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-600"></div>

                    <!-- BOTÃO -->

                    <button type="submit" id="registerButton"
                        class="w-full rounded-xl bg-slate-950 px-6 py-3 font-semibold text-white transition hover:bg-slate-800 disabled:cursor-not-allowed disabled:opacity-60">
                        Criar conta
                    </button>

                </form>

                <!-- ======================================== -->
                <!-- VOLTAR PARA LOGIN -->
                <!-- ======================================== -->

                <div class="mt-6 text-center">

                    <p class="text-sm text-slate-500">
                        Já possui uma conta?
                    </p>

                    <a href="/login.html"
                        class="mt-2 inline-block text-sm font-semibold text-slate-900 hover:text-slate-600">
                        Voltar para o login →
                    </a>

                </div>

            </div>

            <!-- ======================================== -->
            <!-- RODAPÉ -->
            <!-- ======================================== -->

            <p class="mt-6 text-center text-xs text-slate-400">
                Desenvolvido por Jeanderson Amaral
            </p>

        </div>

    </main>

    <script src="/js/register.js"></script>

</body>

</html>
