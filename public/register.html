<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M1News AI | Assistente de redação</title>
    <link rel="icon" type="image/png" href="images/Png/favicon-32x32.png" sizes="32x32">

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: "class"
        };

        if (localStorage.getItem("m1news-tema") === "dark") {
            document.documentElement.classList.add("dark");
        }
    </script>
</head>

<body class="min-h-screen bg-slate-50 transition-colors duration-200 dark:bg-gray-950">

    <main class="flex min-h-screen items-center justify-center px-6 py-12">

        <div class="w-full max-w-md">

            <!-- ======================================== -->
            <!-- CABEÇALHO -->
            <!-- ======================================== -->

            <div class="mb-8 text-center">

                <img src="images/Png/M1_logo.png" alt="M1NewsTV" class="mx-auto h-20 w-28 object-contain">

                <h1 class="text-3xl font-bold tracking-tight text-slate-950 dark:text-gray-100">
                    M1News AI
                </h1>

                <p class="mt-2 text-sm text-slate-500 dark:text-gray-400">
                    Assistente de redação
                </p>

            </div>

            <!-- ======================================== -->
            <!-- CARD -->
            <!-- ======================================== -->

            <div class="rounded-2xl border border-slate-200 bg-white p-8 shadow-sm dark:border-gray-800 dark:bg-gray-900">

                <!-- ======================================== -->
                <!-- TÍTULO -->
                <!-- ======================================== -->

                <div class="mb-6 text-center">

                    <h2 class="text-xl font-bold text-slate-950 dark:text-gray-100">
                        Criar nova conta
                    </h2>

                    <p class="mt-2 text-sm text-slate-500 dark:text-gray-400">
                        Preencha os dados abaixo para criar sua conta.
                    </p>

                </div>

                <!-- ======================================== -->
                <!-- FORMULÁRIO -->
                <!-- ======================================== -->

                <form id="registerForm" class="space-y-5">

                    <!-- USUÁRIO -->

                    <div>

                        <label for="username"
                            class="mb-2 block text-sm font-semibold text-slate-700 dark:text-gray-300">
                            Usuário
                        </label>

                        <input type="text" id="username" name="username" autocomplete="username"
                            placeholder="Digite seu usuário" minlength="3"
                            class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-slate-500 focus:ring-2 focus:ring-slate-200 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-100 dark:placeholder:text-gray-500 dark:focus:border-gray-500 dark:focus:ring-gray-700"
                            required>

                    </div>

                    <!-- SENHA -->

                    <div>

                        <label for="senha"
                            class="mb-2 block text-sm font-semibold text-slate-700 dark:text-gray-300">
                            Senha
                        </label>

                        <div class="relative">

                            <input type="password" id="senha" name="senha" autocomplete="new-password"
                                placeholder="Digite sua senha" minlength="6"
                                class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 pr-12 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-slate-500 focus:ring-2 focus:ring-slate-200 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-100 dark:placeholder:text-gray-500 dark:focus:border-gray-500 dark:focus:ring-gray-700"
                                required>

                            <button type="button" id="toggleSenha"
                                class="absolute right-3 top-1/2 -translate-y-1/2 rounded-lg p-2 text-slate-400 transition hover:text-slate-700 dark:text-gray-500 dark:hover:text-gray-300"
                                aria-label="Mostrar senha">

                                <svg id="eyeSenha" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                    stroke-width="1.8" stroke="currentColor" class="h-5 w-5">

                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M2.036 12.322a1.012 1.012 0 010-.644C3.423 7.51 7.36 5 12 5c4.64 0 8.577 2.51 9.964 6.678.054.16.054.332 0 .644C20.577 16.49 16.64 19 12 19c-4.64 0-8.577-2.51-9.964-6.678z" />

                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />

                                </svg>

                            </button>

                        </div>

                        <p class="mt-2 text-xs text-slate-400 dark:text-gray-500">
                            Mínimo de 6 caracteres.
                        </p>

                    </div>

                    <!-- CONFIRMAR SENHA -->

                    <div>

                        <label for="confirmarSenha"
                            class="mb-2 block text-sm font-semibold text-slate-700 dark:text-gray-300">
                            Confirmar senha
                        </label>

                        <div class="relative">

                            <input type="password" id="confirmarSenha" name="confirmarSenha"
                                autocomplete="new-password" placeholder="Digite sua senha novamente" minlength="6"
                                class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 pr-12 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-slate-500 focus:ring-2 focus:ring-slate-200 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-100 dark:placeholder:text-gray-500 dark:focus:border-gray-500 dark:focus:ring-gray-700"
                                required>

                            <button type="button" id="toggleConfirmarSenha"
                                class="absolute right-3 top-1/2 -translate-y-1/2 rounded-lg p-2 text-slate-400 transition hover:text-slate-700 dark:text-gray-500 dark:hover:text-gray-300"
                                aria-label="Mostrar senha">

                                <svg id="eyeConfirmarSenha" xmlns="http://www.w3.org/2000/svg" fill="none"
                                    viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="h-5 w-5">

                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M2.036 12.322a1.012 1.012 0 010-.644C3.423 7.51 7.36 5 12 5c4.64 0 8.577 2.51 9.964 6.678.054.16.054.332 0 .644C20.577 16.49 16.64 19 12 19c-4.64 0-8.577-2.51-9.964-6.678z" />

                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />

                                </svg>

                            </button>

                        </div>

                    </div>

                    <!-- ERRO / MENSAGEM -->

                    <div id="erro"
                        class="hidden rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-600 dark:border-red-900 dark:bg-red-950/40 dark:text-red-400">
                    </div>

                    <!-- BOTÃO -->

                    <button type="submit" id="registerButton"
                        class="w-full rounded-xl bg-slate-950 px-6 py-3 font-semibold text-white transition hover:bg-slate-800 disabled:cursor-not-allowed disabled:opacity-60 dark:bg-white dark:text-gray-950 dark:hover:bg-gray-200">
                        Criar conta
                    </button>

                </form>

                <!-- ======================================== -->
                <!-- VOLTAR PARA LOGIN -->
                <!-- ======================================== -->

                <div class="mt-6 text-center">

                    <p class="text-sm text-slate-500 dark:text-gray-400">
                        Já possui uma conta?
                    </p>

                    <a href="/login.html"
                        class="mt-2 inline-block text-sm font-semibold text-slate-900 hover:text-slate-600 dark:text-gray-100 dark:hover:text-gray-400">
                        Voltar para o login →
                    </a>

                </div>

            </div>

            <!-- ======================================== -->
            <!-- RODAPÉ -->
            <!-- ======================================== -->

            <p class="mt-6 text-center text-xs text-slate-400 dark:text-gray-500">
                Desenvolvido por Jeanderson Amaral
            </p>

        </div>

    </main>

    <script src="/js/modules/tema.js"></script>
    <script src="/js/register.js"></script>

</body>

</html>
