<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
   <title>M1NewsTV AI | Assistente de redação</title>
    <link rel="icon" type="image/png" href="https://m1newstv.com/wp-content/uploads/2018/02/favicon-32x32.png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50">
    <main class="flex min-h-screen items-center justify-center px-6 py-12">
        <div class="w-full max-w-md">
            <!-- ======================================== -->
            <!-- CABEÇALHO -->
            <!-- ======================================== -->
            <div class="mb-8 text-center">
                <img
                    src="https://m1newstv.com/wp-content/uploads/2026/08/Gemini_Generated_Image_yw8jhqyw8jhqyw8j-4.png"
                    alt="M1NewsTV"
                    class="mx-auto h-28 w-28 object-contain"
                >
                <h1 class="text-3xl font-bold tracking-tight text-slate-950">
                    M1NewsTV AI
                </h1>
                <p class="mt-2 text-sm text-slate-500">
                    Assistente de redação
                </p>
            </div>
            <!-- ======================================== -->
            <!-- CARD -->
            <!-- ======================================== -->

            <div class="rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">

                <!-- ======================================== -->
                <!-- TÍTULO -->
                <!-- ======================================== -->

                <div class="mb-6 text-center">

                    <h2 class="text-xl font-bold text-slate-950">
                        Criar nova conta
                    </h2>

                    <p class="mt-2 text-sm text-slate-500">
                        Preencha os dados abaixo para criar sua conta.
                    </p>

                </div>

                <!-- ======================================== -->
                <!-- FORMULÁRIO -->
                <!-- ======================================== -->

                <form id="registerForm" class="space-y-5">

                    <!-- USUÁRIO -->

                    <div>

                        <label
                            for="username"
                            class="mb-2 block text-sm font-semibold text-slate-700"
                        >
                            Usuário
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            autocomplete="username"
                            placeholder="Digite seu usuário"
                            minlength="3"
                            class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-slate-500 focus:ring-2 focus:ring-slate-200"
                            required
                        >

                    </div>

                    <!-- SENHA -->

                    <div>

                        <label
                            for="senha"
                            class="mb-2 block text-sm font-semibold text-slate-700"
                        >
                            Senha
                        </label>

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            autocomplete="new-password"
                            placeholder="Digite sua senha"
                            minlength="6"
                            class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-slate-500 focus:ring-2 focus:ring-slate-200"
                            required
                        >

                        <p class="mt-2 text-xs text-slate-400">
                            Mínimo de 6 caracteres.
                        </p>

                    </div>

                    <!-- CONFIRMAR SENHA -->

                    <div>

                        <label
                            for="confirmarSenha"
                            class="mb-2 block text-sm font-semibold text-slate-700"
                        >
                            Confirmar senha
                        </label>

                        <input
                            type="password"
                            id="confirmarSenha"
                            name="confirmarSenha"
                            autocomplete="new-password"
                            placeholder="Digite sua senha novamente"
                            minlength="6"
                            class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-slate-500 focus:ring-2 focus:ring-slate-200"
                            required
                        >

                    </div>

                    <!-- ERRO / MENSAGEM -->

                    <div
                        id="erro"
                        class="hidden rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-600"
                    ></div>

                    <!-- BOTÃO -->

                    <button
                        type="submit"
                        id="registerButton"
                        class="w-full rounded-xl bg-slate-950 px-6 py-3 font-semibold text-white transition hover:bg-slate-800 disabled:cursor-not-allowed disabled:opacity-60"
                    >
                        Criar conta
                    </button>

                </form>

                <!-- ======================================== -->
                <!-- VOLTAR PARA LOGIN -->
                <!-- ======================================== -->

                <div class="mt-6 text-center">

                    <p class="text-sm text-slate-500">
                        Já possui uma conta?
                    </p>

                    <a
                        href="/login.html"
                        class="mt-2 inline-block text-sm font-semibold text-slate-900 hover:text-slate-600"
                    >
                        Voltar para o login →
                    </a>

                </div>

            </div>

            <!-- ======================================== -->
            <!-- RODAPÉ -->
            <!-- ======================================== -->

            <p class="mt-6 text-center text-xs text-slate-400">
                Desenvolvido por Jeanderson Amaral
            </p>

        </div>

    </main>

    <script src="/js/register.js"></script>

</body>

</html>
